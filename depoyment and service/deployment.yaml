apiVersion: apps/v1
kind: Deployment
metadata:
  name: eyewear-deployment
  namespace: eyewear
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: eyewear
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eyewear
    spec:
      containers:
      - name: eyewear
        image: 219895243250.dkr.ecr.ap-south-1.amazonaws.com/eyewear:latest
        ports:
        - containerPort: 80
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_HOST

        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_NAME

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_PASSWORD


---
apiVersion: v1
kind: Service
metadata:
  namespace: eyewear
  name: eyewear
spec:
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: NodePort
  selector:
    app.kubernetes.io/name: eyewear
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eyewear
  namespace: eyewear
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/group.name: eyewear-group
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: eyewear
            port:
              number: 80
